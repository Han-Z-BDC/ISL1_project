name: bulkRNAseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - fastqc
  - multiqc
  - fastp
  - star=2.7.5c
  - bowtie2
  - samtools
  - subread   # featureCounts -- kept as a quick cross-check, RSEM is primary quant
  - rsem      # ENCODE-standard quantification (see docs/star_index_notes.md context)
  - rseqc
  - deeptools
