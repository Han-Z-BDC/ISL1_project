# Parameters for scripts/1.3_detect_doublets.py -- step 1.3: doublet
# detection, scDblFinder + Scrublet.
#
# Method (confirmed with the user, matches the lab's own notebook exactly):
#   - scDblFinder runs first, with its own internal threshold (no
#     user-set score cutoff -- it reports a class call, "doublet" or
#     "singlet", directly).
#   - scDblFinder's own doublet call RATE on this sample (n predicted
#     doublets / n cells) is then used as Scrublet's expected_doublet_rate
#     -- Scrublet is deliberately calibrated per sample off scDblFinder's
#     result, not off a fixed loading-chip prior. This dependency is kept
#     on purpose: it lets Scrublet's expectation track the sample's actual
#     observed doublet signal instead of a generic assumption.
#   - A cell is called a doublet if EITHER tool flags it (union), not only
#     if both agree. Both reference pipelines (this lab's own notebook and
#     IGVF-UCSD/CellCommander's 3-way consensus) use a union rule, and the
#     cost is asymmetric: a false-positive doublet call costs one cell: a
#     missed true doublet can masquerade as a real transitional cell state
#     in downstream clustering/trajectory analysis.
#   - Doublets are then removed (not just flagged) from the working object,
#     matching the lab's own notebook.
#
# CellRanger's own doublet calls are NOT used as a third vote here -- the
# lab's own validated method is the two-tool union, not IGVF-UCSD's 3-way
# consensus.

random_state: 1

# Scrublet parameters -- values below are the lab's own validated settings.
# expected_doublet_rate is NOT set here -- it's computed per sample from
# scDblFinder's call rate at run time (see script).
scrublet:
  sim_doublet_ratio: 3
  n_neighbors: 25
  mean_center: true
  normalize_variance: true
  n_prin_comps: 30

# Diagnostic output -- scDblFinder score histogram + doublet-count summary
# per sample, matching the lab's own notebook and the mandatory
# before/after-visualization requirement.
save_diagnostic_plot: true
